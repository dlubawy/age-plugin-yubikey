[package]
name = "age-plugin-yubikey"
description = "YubiKey plugin for age clients"
version = "0.5.0"
authors = ["Jack Grigg <thestr4d@gmail.com>"]
repository = "https://github.com/str4d/age-plugin-yubikey"
readme = "README.md"
keywords = ["age", "cli", "encryption", "yubikey"]
categories = ["command-line-utilities", "cryptography"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.70" # MSRV

[package.metadata.deb]
extended-description = """\
An age plugin adding support for YubiKeys and other PIV hardware tokens."""
section = "utils"
assets = [
    ["target/release/age-plugin-yubikey", "usr/bin/", "755"],
    ["target/manpages/age-plugin-yubikey.1.gz", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/age-plugin-yubikey/README.md", "644"],
]

[dependencies]
age-core = "0.11"
age-plugin = "0.6"
base64 = "0.21"
bech32 = "0.9"
chrono = "0.4"
console = { version = "0.15", default-features = false }
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
env_logger = "0.10"
gumdrop = "0.8"
hex = "0.4"
log = "0.4"
p256 = { version = "=0.14.0-pre.11", features = ["ecdh", "pkcs8"] }
pcsc = "2.4"
sha2 = "0.11.0-rc.0"
which = "5"
x509-cert = "0.3.0-rc.2"
yubikey = { git = "https://github.com/iqlusioninc/yubikey.rs", rev = "872ba35f5453b0bec611b468102c61c123768965", features = ["untested"], version = "0.8.0" }
pkcs8 = "0.10"
curve25519-dalek = "5.0.0-pre.0"
x25519-dalek = { version = "3.0.0-pre.0", features = ["os_rng"]}
ed25519-dalek = "3.0.0-pre.0"
rand_core = { version = "0.9.3", features = ["os_rng"] }
spki = { version = "0.8.0-rc.4", features = ["alloc"] }

# Translations
i18n-embed = { version = "0.15", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.9"
lazy_static = "1"
rust-embed = "8"

# GnuPG coexistence
sysinfo = "0.29"
const-oid = "0.10.1"

[dev-dependencies]
flate2 = "1"
man = "0.3"
tempfile = "3"
test-with = "0.11"
which = "5"
